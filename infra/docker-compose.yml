services:
  # Banco de Dados do RAG Service
  rag-db:
    image: pgvector/pgvector:pg16
    container_name: rag_db
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_database
    ports:
      - "5432:5432" 
    volumes:
      - rag_db_data:/var/lib/postgresql/data
      - ./db-init/rag-db:/docker-entrypoint-initdb.d
    networks:
      - projeto-network

  # Banco de Dados do Vision Service
  vision-db:
    image: pgvector/pgvector:pg16
    container_name: vision_db
    environment:
      POSTGRES_USER: vision_user
      POSTGRES_PASSWORD: vision_password
      POSTGRES_DB: vision_database
    ports:
      - "5433:5432"
    volumes:
      - vision_db_data:/var/lib/postgresql/data
      - ./db-init/vision-db:/docker-entrypoint-initdb.d
    networks:
      - projeto-network

  # Container do LLM (Ollama)
  llm-service:
    image: ollama/ollama:latest
    container_name: llm_service
    ports:
      - "11434:11434" # Expõe a API do LLM na porta 11434
    volumes:
      - ollama_storage:/root/.ollama # Guarda os modelos baixados para não perder ao reiniciar
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu] # Passa a RTX 5060 para dentro do container
    networks:
      - projeto-network

volumes:
  rag_db_data:
  vision_db_data:
  ollama_storage:

networks:
  projeto-network:
    driver: bridge