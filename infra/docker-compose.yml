services:
  # BANCOS DE DADOS E LLM
  rag-db:
    image: pgvector/pgvector:pg16
    container_name: rag_db
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_database
    ports:
      - "5432:5432" 
    volumes:
      - rag_db_data:/var/lib/postgresql/data
      - ./db-init/rag-db:/docker-entrypoint-initdb.d
    networks:
      - agro-network

  vision-db:
    image: pgvector/pgvector:pg16
    container_name: vision_db
    environment:
      POSTGRES_USER: vision_user
      POSTGRES_PASSWORD: vision_password
      POSTGRES_DB: vision_database
    ports:
      - "5433:5432"
    volumes:
      - vision_db_data:/var/lib/postgresql/data
      - ./db-init/vision-db:/docker-entrypoint-initdb.d
    networks:
      - agro-network

  llm-service:
    image: ollama/ollama:latest
    container_name: llm_service
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - agro-network

  # SERVIÇOS
  gateway-ws:
    build: 
      context: ./services/gateway-ws
      dockerfile: Dockerfile
    container_name: agro-gateway
    ports:
      - "8080:8080"
    networks:
      - agro-network
    restart: unless-stopped

  mcp-server:
    build: 
      context: ./services/mcp-server
      dockerfile: Dockerfile
    container_name: agro-mcp
    ports:
      - "3001:3001"
    env_file:
      - ./.env
    networks:
      - agro-network
    restart: unless-stopped

volumes:
  rag_db_data:
  vision_db_data:
  ollama_storage:

networks:
  agro-network:
    name: agro-network
    driver: bridge