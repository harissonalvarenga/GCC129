<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agro Assistente</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:       #16a34a;
      --primary-dark:  #15803d;
      --primary-light: #dcfce7;
      --bg:            #f6f7f6;
      --surface:       #ffffff;
      --border:        #e4e7e4;
      --text:          #111827;
      --muted:         #6b7280;
      --radius:        18px;
      --radius-sm:     8px;
      --shadow:        0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    }

    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif; background: var(--bg); color: var(--text); }

    .app {
      display: flex; flex-direction: column;
      height: 100vh; max-width: 780px;
      margin: 0 auto; background: var(--surface);
      box-shadow: 0 0 0 1px var(--border);
    }

    /* Header */
    .header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px; border-bottom: 1px solid var(--border);
    }
    .logo {
      width: 38px; height: 38px; background: var(--primary);
      border-radius: 11px; display: flex; align-items: center;
      justify-content: center; font-size: 21px; flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 600; line-height: 1.2; }
    .header-sub   { font-size: 12px; color: var(--muted); }
    .status {
      margin-left: auto; display: flex; align-items: center;
      gap: 6px; font-size: 12px; color: var(--muted);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; transition: background .3s; }
    .dot.ok  { background: var(--primary); }
    .dot.err { background: #ef4444; }

    /* Messages */
    .messages {
      flex: 1; overflow-y: auto; padding: 28px 20px;
      display: flex; flex-direction: column; gap: 28px;
      scroll-behavior: smooth;
    }

    /* Welcome */
    .welcome {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; flex: 1; padding: 40px 20px; gap: 14px;
    }
    .welcome-icon { font-size: 54px; }
    .welcome h2   { font-size: 22px; font-weight: 600; }
    .welcome p    { color: var(--muted); max-width: 380px; line-height: 1.65; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; }
    .chip {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 8px 16px; font-size: 13.5px; cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }
    .chip:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }

    /* Message rows */
    .msg { display: flex; gap: 11px; max-width: 100%; }
    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; background: var(--primary-light); align-self: flex-end;
    }
    .msg.user .avatar {
      background: var(--primary); color: #fff;
      font-size: 11px; font-weight: 700; letter-spacing: .3px;
    }

    .bubble { max-width: min(72%, 580px); }

    .msg.user .body {
      background: var(--primary); color: #fff;
      border-radius: var(--radius) var(--radius) 4px var(--radius);
      padding: 11px 16px; font-size: 15px; line-height: 1.55; word-break: break-word;
    }
    .user-thumb { margin-bottom: 6px; border-radius: 12px; overflow: hidden; max-width: 220px; }
    .user-thumb img { width: 100%; display: block; }

    .msg.assistant .body {
      background: var(--bg);
      border-radius: var(--radius) var(--radius) var(--radius) 4px;
      padding: 14px 18px; font-size: 15px; line-height: 1.65;
      word-break: break-word; box-shadow: var(--shadow);
      white-space: pre-wrap;
    }
    /* formatted output after streaming finishes */
    .msg.assistant .body.formatted { white-space: normal; }
    .msg.assistant .body p   { margin: 6px 0; }
    .msg.assistant .body p:first-child { margin-top: 0; }
    .msg.assistant .body p:last-child  { margin-bottom: 0; }
    .msg.assistant .body ol  { padding-left: 22px; margin: 8px 0; }
    .msg.assistant .body li  { margin: 5px 0; }
    .msg.assistant .body strong { font-weight: 600; }

    /* Cursor blink while streaming */
    .streaming::after {
      content: '▋';
      display: inline-block;
      animation: blink .8s step-end infinite;
      color: var(--primary);
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* Intent badge */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 500;
      padding: 3px 9px; border-radius: 20px; margin-bottom: 9px;
    }
    .badge.rag     { background: #dbeafe; color: #1d4ed8; }
    .badge.vision  { background: #fce7f3; color: #be185d; }
    .badge.weather { background: #fef9c3; color: #854d0e; }

    /* Vision diagnosis */
    .diagnosis {
      font-size: 13px; color: #7c3aed; background: #f5f3ff;
      border-left: 3px solid #a78bfa;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 9px 12px; margin-bottom: 11px;
    }
    .diagnosis strong {
      display: block; margin-bottom: 4px;
      font-size: 11px; text-transform: uppercase; letter-spacing: .4px;
    }

    /* Weather card */
    .weather-card {
      background: #fefce8; border: 1px solid #fde68a;
      border-radius: var(--radius-sm);
      padding: 10px 14px; margin-bottom: 11px;
      font-size: 14px; color: #78350f; line-height: 1.5;
      white-space: pre-line;
    }
    .weather-label {
      font-size: 10.5px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .4px;
      color: #92400e; margin-bottom: 4px;
    }

    /* Sources */
    .sources { margin-top: 13px; border-top: 1px solid var(--border); padding-top: 10px; }
    .src-toggle {
      display: flex; align-items: center; gap: 6px;
      font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none;
    }
    .src-toggle:hover { color: var(--text); }
    .src-toggle .arr { transition: transform .2s; display: inline-block; }
    .src-list { margin-top: 9px; display: flex; flex-direction: column; gap: 7px; }
    .src-list.hidden { display: none; }
    .src-card { display: flex; gap: 9px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 11px; }
    .src-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
    .src-name { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; color: var(--text); margin-bottom: 3px; }
    .src-snippet { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Typing indicator */
    .typing {
      display: flex; gap: 5px; align-items: center;
      padding: 14px 18px; background: var(--bg);
      border-radius: var(--radius); width: fit-content; box-shadow: var(--shadow);
    }
    .typing span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); animation: bounce 1.3s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .18s; }
    .typing span:nth-child(3) { animation-delay: .36s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); opacity: .7; }
      30% { transform: translateY(-7px); opacity: 1; }
    }

    /* Input area */
    .input-area { border-top: 1px solid var(--border); background: var(--surface); padding: 12px 16px 14px; }
    .img-preview { display: none; margin-bottom: 10px; position: relative; width: fit-content; }
    .img-preview.on { display: block; }
    .img-preview img { height: 78px; border-radius: 10px; border: 2px solid var(--primary); display: block; }
    .rm-img {
      position: absolute; top: -8px; right: -8px;
      width: 22px; height: 22px; background: #ef4444; color: #fff;
      border: 2px solid #fff; border-radius: 50%; font-size: 13px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .input-row {
      display: flex; align-items: flex-end; gap: 8px;
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 24px; padding: 9px 9px 9px 16px;
      transition: border-color .15s;
    }
    .input-row:focus-within { border-color: var(--primary); }
    textarea {
      flex: 1; background: transparent; border: none; outline: none;
      resize: none; font-family: inherit; font-size: 15px;
      line-height: 1.55; max-height: 160px; overflow-y: auto; color: var(--text);
    }
    textarea::placeholder { color: var(--muted); }
    .actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .btn-icon {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      cursor: pointer; background: transparent; color: var(--muted); font-size: 19px;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
    }
    .btn-icon:hover { background: var(--border); color: var(--text); }
    .btn-send {
      width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, opacity .15s;
    }
    .btn-send:hover    { background: var(--primary-dark); }
    .btn-send:disabled { opacity: .35; cursor: not-allowed; }
    .hint { font-size: 11.5px; color: var(--muted); text-align: center; margin-top: 8px; }

    /* Drag overlay */
    .app.drag::after {
      content: '📎 Solte a imagem aqui';
      position: fixed; inset: 0; background: rgba(22,163,74,.08);
      border: 3px dashed var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 600; color: var(--primary);
      z-index: 200; pointer-events: none;
    }

    @media (max-width: 600px) {
      .app { max-width: 100%; box-shadow: none; }
      .messages { padding: 18px 12px; gap: 20px; }
      .bubble { max-width: 88%; }
      .header { padding: 12px 14px; }
    }
  </style>
</head>
<body>
<div class="app" id="app">

  <header class="header">
    <div class="logo">🌱</div>
    <div>
      <div class="header-title">Agro Assistente</div>
      <div class="header-sub">Baseado nos Manuais Técnicos da EMBRAPA</div>
    </div>
    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="status-label">Conectando…</span>
    </div>
  </header>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">🌾</div>
      <h2>Como posso ajudar?</h2>
      <p>Pergunte sobre manejo, doenças, pragas, adubação ou envie uma foto da sua planta para diagnóstico.</p>
      <div class="chips">
        <button class="chip" onclick="suggest(this)">Ferrugem asiática na soja</button>
        <button class="chip" onclick="suggest(this)">Dose de nitrogênio para milho</button>
        <button class="chip" onclick="suggest(this)">Como fazer calagem do solo?</button>
        <button class="chip" onclick="suggest(this)">Lagarta-do-cartucho no milho</button>
        <button class="chip" onclick="suggest(this)">Vacas em lactação — nutrição</button>
        <button class="chip" onclick="suggest(this)">Irrigação por gotejamento em hortaliças</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="img-preview" id="img-preview">
      <img id="preview-src" src="" alt="">
      <button class="rm-img" onclick="clearImage()">×</button>
    </div>
    <div class="input-row">
      <textarea id="input" rows="1"
        placeholder="Pergunte sobre manejo, doenças, pragas…"
        onkeydown="onKey(event)" oninput="resize(this)"></textarea>
      <div class="actions">
        <input type="file" id="file" accept="image/*" style="display:none" onchange="onFile(this)">
        <button class="btn-icon" onclick="document.getElementById('file').click()" title="Anexar foto">📎</button>
        <button class="btn-send" id="send-btn" onclick="send()" title="Enviar (Enter)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
    <p class="hint">Enter para enviar · Shift+Enter nova linha · Arraste uma foto para a janela</p>
  </div>

</div>
<script>
  const WS_URL = 'ws://localhost:8080';

  let ws, busy = false, imgB64 = null;
  // Streaming state
  let streamBody = null, streamRaw = '', streamMeta = null;

  /* ── Connection ── */
  function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen    = () => setStatus('ok',  'Conectado');
    ws.onerror   = () => setStatus('err', 'Erro');
    ws.onclose   = () => { setStatus('', 'Desconectado — reconectando…'); setTimeout(connect, 3000); };
    ws.onmessage = (e) => onMsg(JSON.parse(e.data));
  }

  function setStatus(cls, txt) {
    document.getElementById('dot').className = 'dot ' + cls;
    document.getElementById('status-label').textContent = txt;
  }

  /* ── Streaming message handler ── */
  function onMsg(data) {
    if (data.type === 'meta') {
      // RAG & other pre-work is done; LLM is about to start.
      removeTyping();
      streamMeta = data;
      streamRaw  = '';
      streamBody = createShell(data);

    } else if (data.type === 'token') {
      // First token can arrive before 'meta' if the path is very fast.
      if (!streamBody) {
        removeTyping();
        streamMeta = { intent: 'rag', sources: [] };
        streamRaw  = '';
        streamBody = createShell(streamMeta);
      }
      streamRaw += data.content;
      streamBody.textContent = streamRaw;
      scrollBottom();

    } else if (data.type === 'done') {
      if (streamBody) {
        // Apply rich formatting now that the full text is available.
        streamBody.classList.remove('streaming');
        streamBody.classList.add('formatted');
        streamBody.innerHTML = fmt(streamRaw);
        if (streamMeta?.sources?.length) appendSources(streamBody.closest('.bubble'), streamMeta.sources);
      }
      streamBody = null; streamRaw = ''; streamMeta = null;
      setBusy(false);

    } else if (data.type === 'error') {
      removeTyping();
      if (streamBody) { streamBody.textContent = data.message || 'Erro.'; streamBody.classList.remove('streaming'); }
      streamBody = null; streamRaw = ''; streamMeta = null;
      setBusy(false);
    }
  }

  /* ── Send ── */
  function send() {
    const inp  = document.getElementById('input');
    const text = inp.value.trim();
    if ((!text && !imgB64) || busy || ws?.readyState !== 1) return;
    hideWelcome();
    appendUser(text, imgB64);
    appendTyping();
    ws.send(JSON.stringify({ message: text, ...(imgB64 && { imageBase64: imgB64 }) }));
    inp.value = ''; inp.style.height = 'auto';
    clearImage();
    setBusy(true);
  }

  function onKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
  function suggest(btn) { document.getElementById('input').value = btn.textContent; resize(document.getElementById('input')); send(); }

  /* ── Image ── */
  function onFile(inp) {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = e => setPreview(e.target.result);
    r.readAsDataURL(f);
    inp.value = '';
  }
  function setPreview(dataUrl) {
    imgB64 = dataUrl.split(',')[1];
    document.getElementById('preview-src').src = dataUrl;
    document.getElementById('img-preview').classList.add('on');
  }
  function clearImage() {
    imgB64 = null;
    document.getElementById('preview-src').src = '';
    document.getElementById('img-preview').classList.remove('on');
  }

  const app = document.getElementById('app');
  app.addEventListener('dragover',  e => { e.preventDefault(); app.classList.add('drag'); });
  app.addEventListener('dragleave', e => { if (!app.contains(e.relatedTarget)) app.classList.remove('drag'); });
  app.addEventListener('drop', e => {
    e.preventDefault(); app.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) {
      const r = new FileReader(); r.onload = ev => setPreview(ev.target.result); r.readAsDataURL(f);
    }
  });

  /* ── DOM helpers ── */
  function hideWelcome() { document.getElementById('welcome')?.remove(); }

  function appendUser(text, b64) {
    const m = el('div', 'msg user');
    m.innerHTML = `
      <div class="avatar">Eu</div>
      <div class="bubble">
        ${b64 ? `<div class="user-thumb"><img src="data:image/jpeg;base64,${b64}" alt=""></div>` : ''}
        ${text ? `<div class="body">${esc(text)}</div>` : ''}
      </div>`;
    attach(m);
  }

  function appendTyping() {
    const m = el('div', 'msg assistant'); m.id = 'typing';
    m.innerHTML = `
      <div class="avatar">🌱</div>
      <div class="bubble">
        <div class="typing"><span></span><span></span><span></span></div>
      </div>`;
    attach(m);
  }

  function removeTyping() { document.getElementById('typing')?.remove(); }

  // Creates the assistant message shell and returns the .body div for token injection.
  function createShell(meta) {
    const labels = { rag: '📚 Manual EMBRAPA', vision: '🔬 Diagnóstico Visual', weather: '🌤️ Clima' };
    const diagHtml = meta.visionDiagnosis
      ? `<div class="diagnosis"><strong>Análise da imagem</strong>${esc(meta.visionDiagnosis)}</div>`
      : '';
    const weatherHtml = meta.weather
      ? `<div class="weather-card"><div class="weather-label">🌡️ Dados climáticos consultados</div>${esc(meta.weather)}</div>`
      : '';
    const m = el('div', 'msg assistant');
    m.innerHTML = `
      <div class="avatar">🌱</div>
      <div class="bubble">
        <span class="badge ${meta.intent || 'rag'}">${labels[meta.intent] || '📚 Manual EMBRAPA'}</span>
        ${weatherHtml}
        ${diagHtml}
        <div class="body streaming"></div>
      </div>`;
    attach(m);
    return m.querySelector('.body');
  }

  function appendSources(bubble, sources) {
    const div = el('div', 'sources');
    div.innerHTML = `
      <div class="src-toggle" onclick="toggleSrc(this)">
        <span class="arr">▶</span>&nbsp;${sources.length} fonte${sources.length > 1 ? 's' : ''} dos manuais
      </div>
      <div class="src-list hidden">
        ${sources.map(s => `
          <div class="src-card">
            <span class="src-icon">📄</span>
            <div>
              <div class="src-name">${esc(s.title)} · p. ${s.page ?? '?'}</div>
              <div class="src-snippet">${esc((s.content || '').slice(0, 200))}</div>
            </div>
          </div>`).join('')}
      </div>`;
    bubble.appendChild(div);
    scrollBottom();
  }

  function toggleSrc(btn) {
    btn.nextElementSibling.classList.toggle('hidden');
    btn.querySelector('.arr').textContent = btn.nextElementSibling.classList.contains('hidden') ? '▶' : '▼';
  }

  /* ── Utils ── */
  function setBusy(v) { busy = v; document.getElementById('send-btn').disabled = v; }

  function resize(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 160) + 'px'; }

  function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }

  function attach(node) { const b = document.getElementById('messages'); b.appendChild(node); scrollBottom(); }

  function scrollBottom() { const b = document.getElementById('messages'); b.scrollTop = b.scrollHeight; }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Rich formatter applied once streaming is complete.
  function fmt(raw) {
    let s = esc(raw);
    const lines = s.split('\n');
    let out = '', inList = false;
    for (const line of lines) {
      const m = line.match(/^(\d+)\.\s+(.*)/);
      if (m) {
        if (!inList) { out += '<ol>'; inList = true; }
        out += `<li>${m[2]}</li>`;
      } else {
        if (inList) { out += '</ol>'; inList = false; }
        out += line.trim() ? `<p>${line}</p>` : '';
      }
    }
    if (inList) out += '</ol>';
    out = out.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    return out;
  }

  connect();
</script>
</body>
</html>
